name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: "1.1-token-test"

permissions:
  contents: read

env:
  IMAGE_NAME: 10sorllabs/comfyui-workflow-launcher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test launcher
        run: |
          python -m pip install -r requirements-launcher.txt pytest
          python -m pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            IMAGE_VERSION=${{ inputs.tag }}
            HF_TOKEN_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
            REQUIRE_HF_DOWNLOAD_TOKEN=1
          secrets: |
            hf_download_token=${{ secrets.HF_DOWNLOAD_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
